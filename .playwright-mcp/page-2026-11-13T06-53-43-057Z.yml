          - generic [ref=f8e87]:
            - heading "Zero Deductible with 100% Coverage Package" [level=3] [ref=f8e92]
            - paragraph [ref=f8e93]: With our 100% coverage package, you'll enjoy peace of mind as there's no deposit required, and you won't need to worry about inspecting for scratches or dents. All damage, even to the rented vehicle, is fully covered.
        - generic [ref=f8e95]:
          - generic: "02"
          - generic [ref=f8e96]:
            - heading "Direct from Airport" [level=3] [ref=f8e100]
            - paragraph [ref=f8e101]: Your car will be waiting in the airport parking lot. Just hop in and drive off. Your journey begins immediately.
        - generic [ref=f8e103]:
          - generic: "03"
          - generic [ref=f8e104]:
            - heading "Online Discount" [level=3] [ref=f8e109]
            - paragraph [ref=f8e110]: Book through our digital platform and save up to 3%, 6% and 12% instantly. Premium service at the best market price.
        - generic [ref=f8e112]:
          - generic: "04"
          - generic [ref=f8e113]:
            - heading "100% Flexible Cancellation Policy" [level=3] [ref=f8e119]
            - paragraph [ref=f8e120]: Life is full of surprises, and we understand that. With our flexible cancellation policy, you only pay for the days you rent, allowing you the freedom to adjust your plans without any hassles.
        - generic [ref=f8e122]:
          - generic: "05"
          - generic [ref=f8e123]:
            - heading "New and Fuel Efficient Cars and Unlimited Miles" [level=3] [ref=f8e128]
            - paragraph [ref=f8e129]: Cruise around the island in style with our top-of-the-line SUV's and pickups. Enjoy a smooth and efficient ride while exploring Bonaire's stunning landscapes.
        - generic [ref=f8e131]:
          - generic: "06"
          - generic [ref=f8e132]:
            - heading "24/7 Self-Service" [level=3] [ref=f8e137]
            - paragraph [ref=f8e138]: Pick up your car whenever it suits you — day or night, fully contactless. No waiting, no hassle.
        - generic [ref=f8e140]:
          - generic: "07"
          - generic [ref=f8e141]:
            - heading "No Hidden Fees" [level=3] [ref=f8e146]
            - paragraph [ref=f8e147]: Transparency is at the core of our values. With YU Car Rental, what you see is what you get. Say goodbye to hidden charges and unexpected fees.
        - generic [ref=f8e149]:
          - generic: "08"
          - generic [ref=f8e150]:
            - heading "Free pick-up service" [level=3] [ref=f8e156]
            - paragraph [ref=f8e157]: No more waiting in line! We offer a hassle free pick-up process, with our free pick-up service. Your rental vehicle will be waiting for you, so you can get started on your Bonaire adventure right away.
        - generic [ref=f8e159]:
          - generic: "09"
          - generic [ref=f8e160]:
            - heading "Multilingual Team" [level=3] [ref=f8e166]
            - paragraph [ref=f8e167]: We speak your language. Our support is available in Dutch, English, Spanish and Papiamentu.
        - generic [ref=f8e169]:
